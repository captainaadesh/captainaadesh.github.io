
name: Deploy React Portfolio

on:
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout React portfolio
        uses: actions/checkout@v4
        with:
          repository: captainaadesh/portfolio-site
          ref: main
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build React application
        working-directory: source
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
